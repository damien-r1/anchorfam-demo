<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mālie Hours</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1A2A">
<style>
/* Layout: the untouched Mālie app (390×844) centred and scaled to fit any screen; nothing else competes with it. */
:root{color-scheme:dark;--ground:#0B1A2A;--ground-2:#050C15;--ink:#E9EFF5}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font:14px/1.4 system-ui,-apple-system,sans-serif;
  background:radial-gradient(120% 80% at 50% 0%,#16304A 0%,var(--ground) 45%,var(--ground-2) 100%)}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:390px;height:844px;flex:none;border-radius:44px;overflow:hidden;background:var(--ground);
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 90px rgba(0,0,0,.55);transform-origin:center center}
.phone iframe{display:block;width:390px;height:844px;border:0;background:var(--ground)}
body.fill .phone{border-radius:0;box-shadow:none}
</style>

<div class="stage"><div class="phone" id="phone"><iframe id="app" src="Main.dc.html" title="Mālie Hours app" allow="autoplay; fullscreen"></iframe></div></div>

<script>
(function(){
  var phone=document.getElementById('phone');
  function fit(){
    var w=window.innerWidth,h=window.innerHeight;
    var small=w<=500;                       // on a phone, the app is the whole screen
    document.body.classList.toggle('fill',small);
    var m=small?0:32;
    var s=Math.min((w-m)/390,(h-m)/844);
    if(!small) s=Math.min(s,1.15);
    phone.style.transform='scale('+s+')';
  }
  window.addEventListener('resize',fit);fit();
})();
</script>

</body></html>
